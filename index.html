<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株主優待財布</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Firebase SDKの読み込み (compat版) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f3f4f6;
    color: #1f2937;
    touch-action: manipulation;
}
.ios-card {
    background: #ffffff;
    border-radius: 1rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
input, select, textarea {
    font-size: 16px !important;
}
@media (min-width: 640px) {
    input, select, textarea {
        font-size: 14px !important;
    }
}
</style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

<!-- 同期ステータス表示用バナー -->
<div id="sync-status" class="bg-indigo-600 text-indigo-100 text-center text-xs py-1 px-4 transition-colors duration-300">
    <i class="fa-solid fa-rotate fa-spin mr-1"></i> クラウドと接続中...
</div>

<!-- ヘッダー -->
<header id="app-header" class="bg-indigo-600 text-white sticky top-0 z-40 shadow-md transition-colors duration-300">
    <div class="max-w-md mx-auto px-3 py-2.5 flex justify-between items-center">
        <div class="flex items-center space-x-1.5 min-w-0 pr-1">
            <i class="fa-solid fa-gift text-base shrink-0"></i>
            <h1 class="font-bold text-sm tracking-tight truncate">株主優待財布 (クラウド同期)</h1>
        </div>
        <div class="flex items-center space-x-1.5 shrink-0">
            <button onclick="openSettingsModal()" class="bg-white/25 hover:bg-white/35 text-white w-7 h-7 rounded-full text-xs font-medium transition active:scale-95 flex items-center justify-center shadow-sm" title="データ管理・設定">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button onclick="openCalcModal()" class="bg-white/25 hover:bg-white/35 text-white w-7 h-7 rounded-full text-xs font-medium transition active:scale-95 flex items-center justify-center shadow-sm" title="お会計シミュレーター">
                <i class="fa-solid fa-calculator"></i>
            </button>
            <button onclick="openHelpModal()" class="bg-white/25 hover:bg-white/35 text-white w-7 h-7 rounded-full text-xs font-medium transition active:scale-95 flex items-center justify-center shadow-sm" title="使い方ガイド">
                <i class="fa-solid fa-question"></i>
            </button>
            <button onclick="openModal()" class="bg-white/25 hover:bg-white/35 text-white px-2.5 py-1 rounded-full text-xs font-medium transition active:scale-95 flex items-center space-x-1 shadow-sm">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>追加</span>
            </button>
        </div>
    </div>
</header>

<!-- メインコンテナ -->
<main class="max-w-md mx-auto px-4 py-4 space-y-4">
    <!-- 総残高サマリー -->
    <section id="summary-card" class="ios-card p-5 bg-gradient-to-br from-indigo-500 to-indigo-700 text-white shadow-lg transition-all duration-300">
        <p id="summary-title" class="text-xs uppercase tracking-wider text-indigo-100 font-medium">優待総額</p>
        <div class="flex items-baseline justify-between mt-1">
            <h2 id="total-balance" class="text-3xl font-extrabold tracking-tight">¥0</h2>
            <span id="active-count" class="text-xs bg-black/20 px-2.5 py-1 rounded-full text-white font-medium backdrop-blur-sm">登録 0件</span>
        </div>
        <div id="summary-footer" class="mt-4 pt-3 border-t border-white/20 flex justify-between text-xs text-indigo-100 transition-colors duration-300">
            <div>期限間近 (30日以内): <span id="near-expiry-count" class="font-bold text-white">0件</span></div>
            <div>使い切り履歴: <button onclick="openHistoryModal()" class="underline font-bold text-white hover:opacity-80"><span id="used-count">0件</span></button></div>
        </div>
    </section>

    <!-- 検索＆カテゴリタブ -->
    <section class="space-y-3">
        <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <i class="fa-solid fa-search"></i>
            </span>
            <input type="text" id="search-input" placeholder="銘柄名、メモで検索..." 
                class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-colors"
                oninput="renderList()">
        </div>
        
        <!-- カテゴリタブ -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
            <button onclick="setCategory('すべて')" id="cat-すべて" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-indigo-600 text-white shadow-sm transition" data-color="indigo" data-bg="bg-indigo-600" data-from="from-indigo-500" data-to="to-indigo-700">すべて</button>
            <button onclick="setCategory('食事')" id="cat-食事" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-sm transition" data-color="orange" data-bg="bg-orange-500" data-from="from-orange-500" data-to="to-orange-600">食事</button>
            <button onclick="setCategory('買い物')" id="cat-買い物" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-sm transition" data-color="emerald" data-bg="bg-emerald-600" data-from="from-emerald-500" data-to="to-emerald-700">買い物</button>
            <button onclick="setCategory('サービス')" id="cat-サービス" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-sm transition" data-color="sky" data-bg="bg-sky-600" data-from="from-sky-500" data-to="to-sky-700">サービス</button>
            <button onclick="setCategory('その他')" id="cat-その他" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-sm transition" data-color="purple" data-bg="bg-purple-600" data-from="from-purple-500" data-to="to-purple-700">その他</button>
        </div>
    </section>

    <!-- リスト表示部 -->
    <section class="space-y-3">
        <div class="flex justify-between items-center px-1">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500">優待一覧 (タップで即時消化)</h3>
            <select id="sort-select" onchange="renderList()" class="bg-transparent text-xs text-gray-600 font-medium focus:outline-none">
                <option value="favoriteFirst">お気に入り優先</option>
                <option value="expiryAsc">有効期限が近い順</option>
                <option value="amountDesc">残高が多い順</option>
                <option value="amountAsc">残高が少ない順</option>
                <option value="nameAsc">50音順</option>
            </select>
        </div>
        <div id="benefit-list" class="space-y-2.5">
            <!-- JavaScriptで動的生成 -->
        </div>
        <!-- 空状態 -->
        <div id="empty-state" class="hidden text-center py-12 px-4 ios-card">
            <div class="text-gray-300 text-4xl mb-2"><i class="fa-solid fa-receipt"></i></div>
            <p class="text-gray-600 font-medium text-sm">該当する優待はありません</p>
        </div>
    </section>
</main>

<!-- 新規追加・編集モーダル -->
<div id="benefit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
            <h3 id="modal-title" class="font-bold text-lg text-gray-800">株主優待の新規登録</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form id="benefit-form" onsubmit="saveBenefit(event)" class="space-y-4">
            <input type="hidden" id="item-id">
            <div>
                <label for="item-company" class="block text-xs font-semibold text-gray-600 uppercase mb-1">銘柄名 *</label>
                <input type="text" id="item-company" required placeholder="例: 吉野家" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="item-amount" class="block text-xs font-semibold text-gray-600 uppercase mb-1">数量・金額 *</label>
                    <input type="number" id="item-amount" required placeholder="3000" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="item-unit" class="block text-xs font-semibold text-gray-600 uppercase mb-1">単位 *</label>
                    <select id="item-unit" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="円">円 (500円単位で消化)</option>
                        <option value="枚">枚 (1枚単位で消化)</option>
                    </select>
                </div>
            </div>
            <div>
                <label for="item-expiry" class="block text-xs font-semibold text-gray-600 uppercase mb-1">有効期限 *</label>
                <input type="date" id="item-expiry" required class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="item-category" class="block text-xs font-semibold text-gray-600 uppercase mb-1">カテゴリ</label>
                    <select id="item-category" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="食事">食事</option>
                        <option value="買い物">買い物</option>
                        <option value="サービス">サービス</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div>
                    <label for="item-rights" class="block text-xs font-semibold text-gray-600 uppercase mb-1">権利確定月</label>
                    <input type="text" id="item-rights" placeholder="例: 3月/9月" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div>
                <label for="item-url" class="block text-xs font-semibold text-gray-600 uppercase mb-1">関連URL (任意)</label>
                <input type="url" id="item-url" placeholder="https://www.yoshinoya.com/" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label for="item-memo" class="block text-xs font-semibold text-gray-600 uppercase mb-1">メモ</label>
                <textarea id="item-memo" rows="2" placeholder="利用条件など" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            
            <div id="delete-btn-container" class="hidden pt-2">
                <button type="button" onclick="deleteCurrentItem()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2.5 rounded-xl text-xs transition border border-red-200 flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>この優待を完全に削除する</span>
                </button>
            </div>

            <div class="pt-3 flex space-x-3">
                <button type="button" onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl text-sm transition">キャンセル</button>
                <button type="submit" id="modal-submit-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-md">保存する</button>
            </div>
        </form>
    </div>
</div>

<!-- 使い切り履歴モーダル -->
<div id="history-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100 shrink-0">
            <h3 class="font-bold text-lg text-gray-800">使い切り履歴</h3>
            <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-gray-600
