<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株主優待財布 - アイコン見比べプレビュー</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; color: #1f2937; }
.ios-card { background: #ffffff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
</style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

<!-- ヘッダー（アイコン見比べ用） -->
<header class="bg-indigo-600 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto px-3 py-3 flex flex-col space-y-2">
        <div class="flex items-center space-x-1.5">
            <i class="fa-solid fa-wallet text-base"></i>
            <h1 class="font-bold text-sm tracking-tight">株主優待財布 (アイコン見比べプレビュー)</h1>
        </div>
        <!-- ご提案中のアイコンを横一列に並べて表示 -->
        <div class="flex items-center justify-around bg-indigo-700/60 p-2 rounded-xl text-xs overflow-x-auto">
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-wallet text-lg mb-0.5"></i><span class="text-[10px]">wallet</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-sack-dollar text-lg mb-0.5"></i><span class="text-[10px]">sack-dollar</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-piggy-bank text-lg mb-0.5"></i><span class="text-[10px]">piggy-bank</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-coins text-lg mb-0.5"></i><span class="text-[10px]">coins</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-gift text-lg mb-0.5"></i><span class="text-[10px]">gift</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-ticket text-lg mb-0.5"></i><span class="text-[10px]">ticket</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-star text-lg mb-0.5"></i><span class="text-[10px]">star</span></div>
            <div class="flex flex-col items-center px-2"><i class="fa-solid fa-clover text-lg mb-0.5"></i><span class="text-[10px]">clover</span></div>
        </div>
    </div>
</header>

<main class="max-w-md mx-auto px-4 py-6 space-y-4">
    <div class="ios-card p-5 text-center space-y-3">
        <h2 class="font-bold text-base text-gray-800">💡 お気に入りのアイコンはありましたか？</h2>
        <p class="text-xs text-gray-600 leading-relaxed">
            上部のヘッダー内に、ご提案したアイコンをすべて並べてみました。<br>
            「このアイコンが一番しっくりくる！」というものが決まりましたら、お気軽にお知らせください！そのアイコンに一本化した最新コードをすぐにお作りします。
        </p>
    </div>
</main>

</body>
</html>
